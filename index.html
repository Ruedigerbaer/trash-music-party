<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}
</style>

</head>

<body>

<img id="bild" alt="">

<script>

const pfad = window.location.pathname;

// Letzten Teil der URL auslesen
const name = pfad.substring(pfad.lastIndexOf("/") + 1);

// Bilddateien zuordnen
const bilder = {
    "Monke": Monke.png: "bilder/Monke.png",
    "Rickroll": Rickroll.gif: "bilder/Rickroll.gif",
   
};

// Bild anzeigen
if (bilder[name]) {
    document.getElementById("bild").src = bilder[name];
}

</script>

</body>
</html>
