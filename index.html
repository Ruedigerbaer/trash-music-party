<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}
</style>

</head>

<body>

<img id="bild" alt="">

<script>

// Den letzten Teil der URL auslesen
const pfad = window.location.pathname;
const name = pfad.substring(pfad.lastIndexOf("/") + 1);

// Zuordnung der URLs zu den Dateien
const bilder = {
    "Monke": "bilder/Monke.png",
    "Rickroll": "bilder/Rickroll.gif",
    "forrest": "bilder/forrest.gif",
    "shit": "bilder/shit.gif",
    "virus": "bilder/virus.gif",
    "miststreuer": "bilder/misstruer.gif",
    "indaface": "bilder/indaface.gif",
    "saufi": "bilder/saufi.gif",
    "hingefallen": "bilder/hingefallen"
    
};

// Passendes Bild laden
if (bilder[name]) {
    document.getElementById("bild").src = bilder[name];
}

</script>

</body>
</html>
